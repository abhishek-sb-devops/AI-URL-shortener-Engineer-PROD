name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    env:
      USE_POSTGRES: "false"
      DATABASE_URL: sqlite:///test_api_urls.db
      ENABLE_RATE_LIMITS: "false"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: url_shortener
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d url_shortener"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: flake8 src/ tests/ --max-line-length=100

      - name: Run unit tests
        run: python -m pytest -v tests/

      - name: Postgres smoke check
        env:
          USE_POSTGRES: "true"
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/url_shortener
          ENABLE_RATE_LIMITS: "false"
        run: |
          python - <<'PY'
          from src.config import settings
          from src.repository import get_repository

          assert settings.use_postgres is True
          repo = get_repository(settings.database_url)
          print(type(repo).__name__)
          assert hasattr(repo, "engine") or hasattr(repo, "_init_db")
          PY
