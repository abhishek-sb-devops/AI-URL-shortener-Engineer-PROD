openapi: 3.0.3
info:
  title: URL Shortener Microservice API
  version: 1.0.0
paths:
  /api/v1/shorten:
    post:
      summary: Shorten a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - original_url
              properties:
                original_url:
                  type: string
                  format: uri
                  example: "https://example.com/very/long/url"
                custom_alias:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: '^[a-zA-Z0-9_-]+$'
                  example: "my-custom-link"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortenResponse'
        '400':
          description: Bad Request / Alias Conflict
components:
  schemas:
    ShortenResponse:
      type: object
      properties:
        short_code:
          type: string
        original_url:
          type: string
        created_at:
          type: string
          format: date-time
    AnalyticsResponse:
      type: object
      properties:
        short_code:
          type: string
        original_url:
          type: string
        created_at:
          type: string
          format: date-time
        total_clicks:
          type: integer
